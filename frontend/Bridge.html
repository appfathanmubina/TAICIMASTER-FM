<!doctype html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TAICIMASTER FM API Bridge</title>
  <style>html,body{margin:0;width:100%;height:100%;background:transparent}#status{position:fixed;left:-9999px;top:-9999px}</style>
</head>
<body>
  <span id="status" aria-hidden="true">TAICIMASTER FM API Bridge</span>
  <script>
  (() => {
    'use strict';
    const BRIDGE_SOURCE = 'taicimaster-fm-api-bridge';
    const PWA_SOURCE = 'taicimaster-fm-pwa';
    const BRIDGE_VERSION = '11.28.6-migration.1';
    let allowedOrigins = [];
    let ready = false;

    const postToPwa = (origin, payload) => {
      if (!origin || origin === '*' || !allowedOrigins.includes(origin)) return;
      try {
        (window.top || window.parent).postMessage(
          Object.assign({source: BRIDGE_SOURCE, bridgeVersion: BRIDGE_VERSION}, payload),
          origin
        );
      } catch (_) {}
    };

    google.script.run
      .withSuccessHandler((cfg) => {
        const candidates = Array.isArray(cfg && cfg.allowedOrigins) ? cfg.allowedOrigins : [];
        allowedOrigins = candidates.map(x => String(x || '').trim())
          .filter(x => /^https:\/\/appfathanmubina\.github\.io$/.test(x));
        ready = allowedOrigins.length > 0;
        if (ready) allowedOrigins.forEach(origin => postToPwa(origin, {type:'ready'}));
      })
      .withFailureHandler(() => { allowedOrigins = []; ready = false; })
      .getTaiciPwaBridgeConfig();

    window.addEventListener('message', (event) => {
      if (!allowedOrigins.includes(event.origin)) return;
      const data = event.data || {};
      if (data.source !== PWA_SOURCE || data.type !== 'request') return;
      const id = String(data.id || '');
      const fn = String(data.fn || '');
      const args = Array.isArray(data.args) ? data.args : [];
      if (!id || !fn) return;

      if (!ready) {
        postToPwa(event.origin, {type:'response', id, ok:false,
          error:{code:'BRIDGE_NOT_READY', message:'API bridge belum siap.'}});
        return;
      }

      google.script.run
        .withSuccessHandler(result => postToPwa(event.origin, {type:'response', id, ok:true, result}))
        .withFailureHandler(err => postToPwa(event.origin, {type:'response', id, ok:false,
          error:{code:'RPC_ERROR', message:String(err && err.message || 'Komunikasi backend gagal.')}})
        )
        .taiciPwaBridgeCall(fn, args);
    });
  })();
  </script>
</body>
</html>
